<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Results</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="result-page">

        <div class="result-shape result-one">✦</div>
        <div class="result-shape result-two">✧</div>
        <div class="result-shape result-three"></div>
        <div class="result-shape result-four"></div>
        <div class="result-shape result-five"></div>


        <section class="result-card">

            <p class="result-label">
                THE VERDICT IS IN
            </p>


            <div class="trophy">
                🏆
            </div>


            <h1>
                Well...
            </h1>

            <p class="result-title">
                let's see how well<br>
                <em>you actually know me.</em>
            </p>


            <div class="score-circle">

                <div class="score-number" id="percentage">
                    0%
                </div>

                <span>
                    FRIENDSHIP
                </span>

            </div>


            <div class="score-details">

                <div class="detail-box">

                    <span>
                        SCORE
                    </span>

                    <strong id="score">
                        0
                    </strong>

                </div>


                <div class="detail-box">

                    <span>
                        OUT OF
                    </span>

                    <strong id="total">
                        20
                    </strong>

                </div>

            </div>


            <p
                class="result-message"
                id="resultMessage">
                Calculating your friendship status...
            </p>


            <div class="result-divider">
                ✦ ✧ ✦
            </div>


            <p class="final-message">
                Thanks for playing.
                <br>
                You survived the friendship test.
            </p>


            <div class="result-buttons">

                <button
                    class="play-again"
                    id="playAgain">

                    PLAY AGAIN
                    <span>↻</span>

                </button>

                <button
                    class="home-btn"
                    id="homeBtn">

                    HOME

                </button>

            </div>

        </section>

    </main>


    <script src="result.js"></script>

</body>

</html>
